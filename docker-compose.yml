version: "3"

services:

  # 🎛️ CONTROLLER
  controller-service:
    build: ./controller-service
    ports:
      - "4000:4000"

  # 🔐 AUTH
  auth-service:
    build: ./auth-service
    ports:
      - "4001:4001"

  # 👤 USER
  user-service:
    build: ./user-service
    ports:
      - "4002:4002"

  # 🤝 FRIEND
  friend-service:
    build: ./friend-service
    ports:
      - "4006:4006"

  # 📝 POST (WITH IMAGE 🔥)
  post-service:
    build: ./post-service
    ports:
      - "4003:4003"
    volumes:
      - ./post-service/uploads:/app/uploads

  # 📰 FEED
  feed-service:
    build: ./feed-service
    ports:
      - "4004:4004"

  # 💬 COMMENT
  comment-service:
    build: ./comment-service
    ports:
      - "4005:4005"

  # 🔔 NOTIFICATION
  notification-service:
    build: ./notification-service
    ports:
      - "4007:4007"

  # 🚪 API GATEWAY
  api-gateway:
    build: ./api-gateway
    ports:
      - "4008:4008"
    depends_on:
      - auth-service
      - user-service
      - post-service
      - feed-service
      - comment-service
      - friend-service
      - notification-service